    <circle cx="700" cy="41" r="6" fill="#9fb2c9"/>
    <text x="712" y="46" font-size="13.5" fill="#374151">2014</text>
    <circle cx="778" cy="41" r="6" fill="#2f4a6d"/>
    <text x="790" y="46" font-size="13.5" fill="#374151">2025</text>
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="236.0" y1="80" x2="236.0" y2="400"/>
      <line x1="363.2" y1="80" x2="363.2" y2="400"/>
      <line x1="490.4" y1="80" x2="490.4" y2="400"/>
      <line x1="617.6" y1="80" x2="617.6" y2="400"/>
      <line x1="744.8" y1="80" x2="744.8" y2="400"/>

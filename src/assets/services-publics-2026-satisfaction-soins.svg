    <circle cx="566.7" cy="104" r="6.5" fill="#2f4a6d"/>
    <text x="552.7" y="109" font-size="15" font-weight="600" fill="#111827" text-anchor="end">66</text>
    <text x="733.4" y="109" font-size="15" font-weight="600" fill="#111827">78</text>
    <text x="220" y="109" font-size="15" fill="#374151" text-anchor="end">Hôpitaux publics</text>
    <line x1="312.3" y1="190" x2="477.7" y2="190" stroke="#cbd5e1" stroke-width="3"/>

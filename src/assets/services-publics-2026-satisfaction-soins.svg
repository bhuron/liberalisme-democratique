    <circle cx="312.3" cy="190" r="6.5" fill="#2f4a6d"/>
    <text x="298.3" y="195" font-size="15" font-weight="600" fill="#111827" text-anchor="end">46</text>
    <text x="491.7" y="195" font-size="15" font-weight="600" fill="#111827">59</text>
    <text x="220" y="195" font-size="15" fill="#374151" text-anchor="end">Urgences hospitalières</text>
    <line x1="693.9" y1="276" x2="808.4" y2="276" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="808.4" cy="276" r="6.5" fill="#9fb2c9"/>
    <circle cx="693.9" cy="276" r="6.5" fill="#2f4a6d"/>
    <text x="679.9" y="281" font-size="15" font-weight="600" fill="#111827" text-anchor="end">76</text>
    <text x="822.4" y="281" font-size="15" font-weight="600" fill="#111827">85</text>
    <text x="220" y="281" font-size="15" fill="#374151" text-anchor="end">Maternités</text>
    <line x1="719.4" y1="362" x2="757.5" y2="362" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="757.5" cy="362" r="6.5" fill="#9fb2c9"/>
    <circle cx="719.4" cy="362" r="6.5" fill="#2f4a6d"/>
    <text x="705.4" y="367" font-size="15" font-weight="600" fill="#111827" text-anchor="end">78</text>
